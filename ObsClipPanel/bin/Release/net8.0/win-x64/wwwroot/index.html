<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celeste Auto Cut OBS Panel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="layout">
    <header>
      <h1>Celeste Auto Cut OBS Panel</h1>
      <p>OBS Browser Dock 面板：连 websocket、采样录制状态、生成房间通关合成视频。</p>
    </header>

    <section class="card">
      <h2>连接与路径</h2>
      <div class="grid two">
        <label>OBS WebSocket URL<input id="obsUrl"></label>
        <label>OBS 密码<input id="obsPassword" type="password"></label>
        <label>工作目录<input id="workingDirectory"></label>
        <label>Celeste room_events.jsonl<input id="roomEventsPath"></label>
        <label>最终视频输出根目录<input id="outputDirectory" placeholder="留空则使用 OBS 录制目录"></label>
        <label>ffmpeg.exe 路径<input id="ffmpegPath"></label>
        <label>最终文件名 / 模板<input id="finalOutputName" placeholder="{recording_start_local}.mp4"></label>
      </div>
      <p>默认会按录制开始时间生成，例如 <code>2026-05-18 22-42-41.mp4</code>。</p>
      <div class="grid three">
        <label>轮询 ms<input id="pollIntervalMs" type="number"></label>
        <label>前摇 ms<input id="preRollMs" type="number"></label>
        <label>后摇 ms<input id="postRollMs" type="number"></label>
        <label>锚点容差 ms<input id="maxAnchorGapMs" type="number"></label>
        <label>切点误差 ms<input id="maxCutErrorMs" type="number"></label>
      </div>
      <div class="row checks">
        <label><input id="splitOnPause" type="checkbox"> pause 自动切开</label>
        <label><input id="requireExistingFiles" type="checkbox"> 要求源文件存在</label>
        <label><input id="autoAssembleOnStop" type="checkbox"> 停止录制后自动合成</label>
      </div>
      <div class="row">
        <button id="saveSettings">保存设置</button>
        <button id="resetSession">新建会话</button>
        <button id="connectObs">连接 OBS</button>
        <button id="disconnectObs">断开 OBS</button>
      </div>
    </section>

    <section class="card">
      <h2>OBS 控制</h2>
      <div class="row">
        <button id="startRecord">开始录制</button>
        <button id="stopRecord">停止录制</button>
        <button id="pauseRecord">暂停录制</button>
        <button id="resumeRecord">继续录制</button>
        <button id="splitRecordFile">分段文件</button>
      </div>
    </section>

    <section class="card">
      <h2>合成</h2>
      <div class="row">
        <button id="buildFinal">生成最终视频</button>
      </div>
      <pre id="artifactPaths" class="paths"></pre>
    </section>

    <section class="card">
      <h2>状态</h2>
      <div id="badges" class="row badges"></div>
      <pre id="statusBox"></pre>
      <pre id="messageBox"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
